name: nightly-fuzz

# Nightly long-fuzz run (action plan "Nightly long fuzz"): every fuzz
# target gets 10 minutes instead of the 60s PR budget, so deep state
# spaces (lifecycle programs, dedupe widths, compile configs) get real
# exploration. Crashers are minimized into testdata/fuzz by the Go
# tooling and uploaded as workflow artifacts; failures are reported as
# issues so a nightly break is impossible to miss.

on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: read
  issues: write # nightly failure reports

jobs:
  fuzz-core:
    name: core (10m per target)
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Fuzz root-package targets for 10 minutes each
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/fuzz
          echo "core fuzz failures:" > /tmp/fuzz/core-failures
          for target in FuzzRecordEncodedDedupe FuzzEndLifecycle FuzzDedupeFields FuzzCompileConfig FuzzCrashAdversarialValues FuzzCrashGuardedInterleavings; do
            echo "=== $target ==="
            if go test . -run '^$' -fuzz "^$target$" -fuzztime 10m; then
              echo "PASS $target"
            else
              echo "FAIL $target"
              echo "  - $target" >> /tmp/fuzz/core-failures
            fi
          done
          echo "=== FuzzMiddlewareRequest ==="
          if (cd integration/std && go test . -run '^$' -fuzz '^FuzzMiddlewareRequest$' -fuzztime 10m); then
            echo "PASS FuzzMiddlewareRequest"
          else
            echo "FAIL FuzzMiddlewareRequest"
            echo "  - FuzzMiddlewareRequest" >> /tmp/fuzz/core-failures
          fi

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-crash-artifacts
          path: |
            testdata/fuzz/
            integration/std/testdata/fuzz/
          if-no-files-found: ignore

      - name: Decide whether core failed
        shell: bash
        run: |
          # grep exits 1 on no match; set -e is on, so guard with ||.
          if grep -q 'FAIL' /tmp/fuzz/core-failures 2>/dev/null; then
            echo "report=yes" >> "$GITHUB_ENV"
          else
            echo "report=no" >> "$GITHUB_ENV"
          fi || true
      - name: Create issue for core failures
        if: env.report == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/fuzz/core-failures', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly core fuzz failures (${new Date().toISOString().slice(0, 10)})`,
              body: body + '\n\nCrash artifacts: https://github.com/' +
                context.repo.owner + '/' + context.repo.repo +
                '/actions/runs/' + context.runId,
            });

  fuzz-encoder:
    name: encoder (10m per target)
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      - name: Fuzz JSON targets for 10 minutes each
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/fuzz
          echo "encoder fuzz failures:" > /tmp/fuzz/encoder-failures
          for target in FuzzAppendString FuzzAppendBytes FuzzAppendFloat32 \
                        FuzzAppendFloat64 FuzzAppendTimeRFC3339 FuzzAppendInterface; do
            echo "=== $target ==="
            if go test ./internal/json -run '^$' -fuzz "^$target$" -fuzztime 10m; then
              echo "PASS $target"
            else
              echo "FAIL $target"
              echo "  - $target" >> /tmp/fuzz/encoder-failures
            fi
          done

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encoder-crash-artifacts
          path: internal/json/testdata/fuzz/
          if-no-files-found: ignore

      - name: Decide whether encoder failed
        shell: bash
        run: |
          if grep -q 'FAIL' /tmp/fuzz/encoder-failures 2>/dev/null; then
            echo "report=yes" >> "$GITHUB_ENV"
          else
            echo "report=no" >> "$GITHUB_ENV"
          fi || true
      - name: Create issue for encoder failures
        if: env.report == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/fuzz/encoder-failures', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly encoder fuzz failures (${new Date().toISOString().slice(0, 10)})`,
              body: body + '\n\nCrash artifacts: https://github.com/' +
                context.repo.owner + '/' + context.repo.repo +
                '/actions/runs/' + context.runId,
            });
