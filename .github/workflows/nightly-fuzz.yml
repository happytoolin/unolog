name: nightly-fuzz

# Nightly long-fuzz run: every fuzz target gets 10 minutes instead of the
# 60s PR budget, so deep state spaces (lifecycle programs, dedupe widths,
# compile configs, limits) get real exploration. Packages fan out in
# parallel; scripts/fuzz.sh finds the targets, so a new Fuzz function
# needs no edit here. Failing inputs are minimized into testdata/fuzz by
# the Go tooling and uploaded as workflow artifacts; a failure opens an
# issue so a nightly break is impossible to miss.

on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC
  workflow_dispatch: {} # manual trigger for testing

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: List packages with fuzz targets
        id: list
        run: echo "dirs=$(scripts/fuzz.sh -j)" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.dir }} (10m per target)
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.targets.outputs.dirs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Fuzz every target for 10 minutes
        env:
          FUZZ_FAILURES_FILE: ${{ runner.temp }}/fuzz-report/failed-${{ strategy.job-index }}.txt
        run: |
          mkdir -p "$(dirname "$FUZZ_FAILURES_FILE")"
          scripts/fuzz.sh -t 10m "${{ matrix.dir }}"

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ strategy.job-index }}
          path: ${{ matrix.dir }}/testdata/fuzz/
          if-no-files-found: ignore

      # The report job lists these "dir target" lines in the issue.
      - name: Upload failed target list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report-${{ strategy.job-index }}
          path: ${{ runner.temp }}/fuzz-report/
          if-no-files-found: ignore

  report:
    needs: fuzz
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download failed target lists
        uses: actions/download-artifact@v4
        continue-on-error: true # a job can fail before it writes a list
        with:
          pattern: fuzz-report-*
          path: fuzz-report
          merge-multiple: true

      - name: Open an issue for the failed run
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = fs.existsSync('fuzz-report')
              ? fs.readdirSync('fuzz-report').flatMap((f) =>
                  fs.readFileSync(path.join('fuzz-report', f), 'utf8').split('\n').filter(Boolean))
              : [];
            const list = failed.length
              ? failed.map((t) => `- \`${t}\``).join('\n')
              : '- No target list: a job failed outside the fuzz step. See the run.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly fuzz failures (${new Date().toISOString().slice(0, 10)})`,
              body: `Failed targets (package dir, target):\n\n${list}\n\nThe job logs and the failing inputs (artifacts) are in ${run}.\n\nReproduce locally with \`scripts/fuzz.sh -t 10m <package-dir>\`, then commit the input under \`testdata/fuzz/\` as a regression test.`,
            });
