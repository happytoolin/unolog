name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', '1.26.x', '1.27.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6.2.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Test all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== testing $moddir =="
            (
              cd "$moddir"
              go test -shuffle=on -count=1 ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

      - name: Race all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== racing $moddir =="
            (
              cd "$moddir"
              go test -race -shuffle=on -count=1 ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

      - name: Vet all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== vet $moddir =="
            (
              cd "$moddir"
              go vet ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

      - name: Check gofmt
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . 2>/dev/null)"
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.2.0
        with:
          # The toolchain must satisfy the linter's own go directive (go 1.26);
          # the modules themselves keep their go 1.25 floor.
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: Lint all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== lint $moddir =="
            (
              cd "$moddir"
              go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

  vuln:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: govulncheck all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== govulncheck $moddir =="
            (
              cd "$moddir"
              go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      # 60s per target comfortably exceeds the 1M-exec gate (~200k
      # execs/s for these oracles locally); increase if CI runners
      # regress. Numeric/time/interface oracles and the record-level
      # dedupe fuzz follow the DST research plan (P2/P4).
      - name: Fuzz JSON encoder (SWAR vs zerolog table)
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/json -run '^$' -fuzz '^FuzzAppendString$' -fuzztime 60s
          go test ./internal/json -run '^$' -fuzz '^FuzzAppendBytes$' -fuzztime 60s

      - name: Fuzz JSON numeric, time and interface paths
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/json -run '^$' -fuzz '^FuzzAppendFloat64$' -fuzztime 60s
          go test ./internal/json -run '^$' -fuzz '^FuzzAppendFloat32$' -fuzztime 60s
          go test ./internal/json -run '^$' -fuzz '^FuzzAppendTimeRFC3339$' -fuzztime 60s
          go test ./internal/json -run '^$' -fuzz '^FuzzAppendInterface$' -fuzztime 60s

      - name: Fuzz record encode (dedupe LWW + canonical collisions)
        shell: bash
        run: |
          set -euo pipefail
          go test . -run '^$' -fuzz '^FuzzRecordEncodedDedupe$' -fuzztime 60s

      - name: Fuzz core lifecycle, dedupe and config paths
        shell: bash
        run: |
          set -euo pipefail
          go test . -run '^$' -fuzz '^FuzzEndLifecycle$' -fuzztime 60s
          go test . -run '^$' -fuzz '^FuzzDedupeFields$' -fuzztime 60s
          go test . -run '^$' -fuzz '^FuzzCompileConfig$' -fuzztime 60s
          go test . -run '^$' -fuzz '^FuzzErrorGraph$' -fuzztime 60s
          go test . -run '^$' -fuzz '^FuzzCrashAdversarialValues$' -fuzztime 60s
          go test . -run '^$' -fuzz '^FuzzCrashGuardedSequences$' -fuzztime 60s

      - name: Fuzz net/http middleware state machine
        working-directory: integration/std
        run: go test . -run '^$' -fuzz '^FuzzMiddlewareRequest$' -fuzztime 60s
