name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', '1.26.x', '1.27.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6.2.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Test all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== testing $moddir =="
            (
              cd "$moddir"
              go test -shuffle=on -count=1 ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

      - name: Race all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== racing $moddir =="
            (
              cd "$moddir"
              go test -race -shuffle=on -count=1 ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

      - name: Vet all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== vet $moddir =="
            (
              cd "$moddir"
              go vet ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

      - name: Check gofmt
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . 2>/dev/null)"
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.2.0
        with:
          # The toolchain must satisfy the linter's own go directive (go 1.26);
          # the modules themselves keep their go 1.25 floor.
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: Lint all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== lint $moddir =="
            (
              cd "$moddir"
              go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

  vuln:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: govulncheck all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== govulncheck $moddir =="
            (
              cd "$moddir"
              go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

  fuzz-targets:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # The script finds every package with a Fuzz function, so a new
      # target joins this matrix without a workflow edit.
      - name: List packages with fuzz targets
        id: list
        run: echo "dirs=$(scripts/fuzz.sh -j)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: fuzz-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.fuzz-targets.outputs.dirs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go
        uses: actions/setup-go@v6.2.0
        with:
          # The module floor: the encoder oracles also run against the
          # pre-v2 encoding/json engine here.
          go-version: '1.25.x'
          check-latest: true
          cache: true
          cache-dependency-path: '**/go.sum'

      # 60s per target comfortably exceeds the 1M-exec gate (~200k
      # execs/s for these oracles locally); increase if CI runners
      # regress.
      - name: Fuzz ${{ matrix.dir }}
        run: scripts/fuzz.sh -t 60s "${{ matrix.dir }}"

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ strategy.job-index }}
          path: ${{ matrix.dir }}/testdata/fuzz/
          if-no-files-found: ignore
